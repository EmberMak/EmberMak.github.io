    <title>Bright Spirit</title>
    <style>
      /* Inlined so the splash paints before any bundle loads. */
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #07070a;
        color: #cdc6b6;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        user-select: none;
      }
      #game {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        background: #07070a;
        touch-action: none;
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #07070a;
        transition: opacity 0.5s ease;
      }
      #splash.hidden { opacity: 0; pointer-events: none; }
      #splash h1 {
        margin: 0;
        font-family: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
        font-size: clamp(28px, 7vw, 62px);
        font-weight: 400;
        letter-spacing: 0.34em;
        text-indent: 0.34em;
        color: #cfe3f5;
        text-shadow: 0 0 26px rgba(207, 227, 245, 0.22);
      }
      #splash .rule {
        width: min(340px, 62vw);
        height: 1px;
        background: linear-gradient(90deg, transparent, #4a4740, transparent);
      }
      #splash-status {
        font-size: 12px;
        letter-spacing: 0.18em;
        color: #6a655c;
        text-transform: uppercase;
      }
      #splash .legal {
        position: absolute;
        bottom: 22px;
        font-size: 10px;
        letter-spacing: 0.12em;
        color: #4a4740;
      }
      /* A slow breathing pulse — the game's whole mood in three lines of CSS. */
      @keyframes bs-breathe { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
      #splash-status { animation: bs-breathe 2.6s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { #splash-status { animation: none; } }
    </style>
